events {
    worker_connections 1024;
}

http {
    server {
        ## Escuta a porta :80, e usa o meu domínio próprio
        listen 80;
        server_name pedro-ammes.com.br www.pedro-ammes.com.br;

       location / {
           return 301 https://$host$request_uri;
       }
    }

    server {
        listen 443 ssl;
        server_name pedro-ammes.com.br www.pedro-ammes.com.br;

        ## Usa a key do ssl pro meu dominio, gerei ela usando o Let's Encrypt
        ssl_certificate /etc/letsencrypt/live/pedro-ammes.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pedro-ammes.com.br/privkey.pem;

        ## Seta o root como o diretorio padrão do nginx e serve o index.html que tem dentro
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Seta o backend pra ficar em /api/...
        # backend é o nome do container e 80 a porta do backend, como a rede é bridge isso é permitido
        location /api/ {
            proxy_pass http://backend:80;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

    }
}